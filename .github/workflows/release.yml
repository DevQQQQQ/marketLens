name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 同一 tag 的重复推送不再并发跑两条发布链（旧版无此段：两条流水线会同时向
# Marketplace 推同一个版本，且后一条会覆盖前一条的 Release 制品）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release VSIX
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Guard 需要 main 的历史来判断 tag 是否已合入发布基线，浅克隆拿不到 merge-base
          fetch-depth: 0

      # ── Guard 1：tag 名必须等于 package.json.version ────────────────────────────
      # 旧版没有这条校验，打错 tag（如把 v1.3.1 打成 v1.30.1）会照发不误，
      # 发出去的版本号与 CHANGELOG / README 徽章全部错位。
      - name: Guard - tag version must equal package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=v$TAG  package.json=v$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($GITHUB_REF_NAME) 与 package.json.version ($PKG) 不一致，终止发布"
            exit 1
          fi

      # ── Guard 2：tag 必须打在 main 上 ───────────────────────────────────────────
      # 旧版允许打在 dev 私有提交上的 tag 直接发布，会把未评审的增量推到生产。
      - name: Guard - tag commit must already be on main
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME 指向的提交不在 main 基线上，请先按 AGENTS.md §3 把 dev 合入 main 再打 tag"
            exit 1
          fi

      # ── Guard 3：发版资产同步只校验、不代做 ─────────────────────────────────────
      # 与 AGENTS.md §8 的口径一致：漂移直接判红，而不是像 prepackage 那样顺手改写并删包。
      - name: Guard - release assets must already be in sync
        run: npm run sync-version:check

      # ── Guard 4：两个注册表都缺凭据才判红 ───────────────────────────────────────
      # 产品口径（v1.3.1 实测校准）：Open VSX 由 CI 自动发布，VS Code Marketplace 由
      # 维护者本人手动发布，因此「只配了一个 secret」是**常态而非误配**。
      # 旧版把 VSCE_PAT 缺失写成 exit 1，结果连带后面的 GitHub Release 制品一起被拦掉
      # （v1.3.1 那次 10 秒即红、什么都没发出去）。只有两者皆空时这条流水线才真的
      # 什么都不发布——那才是需要判红的静默空跑。
      - name: Guard - publishing credentials must be present
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT 未配置：跳过 Marketplace 发布（该平台按 RELEASE.md 第 4 节由维护者手动发布）"
          fi
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT 未配置：跳过 Open VSX 发布"
          fi
          if [ -z "$VSCE_PAT" ] && [ -z "$OVSX_PAT" ]; then
            echo "::error::VSCE_PAT 与 OVSX_PAT 均未配置：本次流水线不会发布到任何注册表。若只想产出 GitHub Release 制品，请删掉本守卫后重跑。"
            exit 1
          fi

      # 与本地门禁运行时严格同源（24.22.1 自带 npm 11.19.1），须与 ci.yml 保持同值。
      - name: Setup Node.js 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Package extension (.vsix)
        run: npm run package

      # 产物锚定：后续两个 publish 步骤都发布这同一个文件，杜绝「CI 里重新打包」
      # 导致 Release 制品与注册表制品不同源。
      - name: Resolve VSIX artifact
        run: |
          count=$(ls marketlens-*.vsix 2>/dev/null | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::期望恰好 1 个 vsix，实际 $count 个"
            exit 1
          fi
          ls -l marketlens-*.vsix
          echo "VSIX=$(ls marketlens-*.vsix | head -1)" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true

      # Marketplace 由维护者手动发布时本步自动跳过；`.vsix` 已挂在 GitHub Release 上，
      # 下载后 `code --install-extension` 或 vsce publish 均可。
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath "$VSIX"

      - name: Publish to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.3.0 publish --packagePath "$VSIX" -p "$OVSX_PAT"
