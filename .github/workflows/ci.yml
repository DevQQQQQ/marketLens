name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 与本地门禁运行时严格同源（24.22.1 自带 npm 11.19.1）。
      # 本地升 Node 补丁版时必须同步 ci.yml 与 release.yml 两处，否则「本地绿、远端红」的分叉面重新打开。
      - name: Setup Node.js 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code style check (ESLint)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Security audit (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run unit tests & coverage report
        run: npm run test:coverage

      - name: Build extension
        run: npm run build

      - name: Verify package (.vsix)
        run: npm run package

      - name: Upload VSIX package
        uses: actions/upload-artifact@v4
        with:
          name: marketlens-vsix
          path: "*.vsix"
          retention-days: 7

